<title>Miles 4 Smiles – Roparun Team 283</title>
<meta name="description" content="Alle links van Roparun Team 283 Miles 4 Smiles: doneren, loten kopen, teampagina en Instagram.">

<style>
  :root{--pink:#E6007E;--pink-dark:#B80065;--black:#000;--white:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',system-ui,sans-serif;min-height:100vh;color:var(--white);
       background:var(--pink);display:flex;flex-direction:column;align-items:center}
  header{width:100%;background:var(--black);padding:28px 16px 34px;text-align:center;
         clip-path:polygon(0 0,100% 0,100% 85%,0 100%)}
  header img{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
  main{width:100%;max-width:520px;padding:24px 16px 40px;text-align:center}
  h1{font-weight:800;font-size:2.4rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
  .team{display:inline-block;margin:12px 0 6px;padding:4px 14px;border-radius:999px;
        background:var(--black);font-weight:600;font-size:.95rem}
  .tag{font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:.9rem;opacity:.95;margin-bottom:28px}
  .links{display:flex;flex-direction:column;gap:14px}
  .links a{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:16px;
           background:var(--white);color:var(--black);text-decoration:none;font-weight:600;font-size:1.05rem;
           box-shadow:0 4px 0 var(--pink-dark);transition:transform .15s,box-shadow .15s}
  .links a:hover,.links a:focus-visible{transform:translateY(-2px);box-shadow:0 6px 0 var(--pink-dark);outline:none}
  .links a:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pink-dark)}
  .links a.primary{background:var(--black);color:var(--white);box-shadow:0 4px 0 #000}
  .links a.primary .ic{background:var(--pink)}
  .ic{flex:0 0 40px;height:40px;border-radius:12px;background:var(--pink);color:var(--white);
      display:grid;place-items:center}
  .ic svg{width:22px;height:22px}
  .txt{flex:1;text-align:left}
  .txt small{display:block;font-weight:400;font-size:.8rem;opacity:.65}
  .arr{opacity:.4;font-size:1.2rem}
  footer{margin-top:32px;font-size:.8rem;opacity:.85}
</style>
